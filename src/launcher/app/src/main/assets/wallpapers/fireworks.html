<!-- Built with iappyxOS Launcher -->
<!doctype html><html><head><title>Fireworks</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;padding:0;background:#000;overflow:hidden;">
<canvas id="c" style="position:fixed;inset:0;width:100vw;height:100vh;display:block;"></canvas>
<script>
(function(){
  const c=document.getElementById('c'),ctx=c.getContext('2d');
  function fit(){c.width=innerWidth;c.height=innerHeight;}
  fit(); window.onresize=fit;

  let visible=true, pageOffset=0, tiltX=0, tiltY=0;
  if(window.iappyx){
    iappyx.onVisibility=v=>{visible=!!v;};
    iappyx.onPageOffset=v=>{pageOffset=v;};
    iappyx.onAccelerometer=(ax,ay,az)=>{
      tiltX=tiltX*0.9+ax*0.1;
      tiltY=tiltY*0.9+ay*0.1;
    };
    iappyx.enableAccelerometer(true);
  }

  // Palette of firework colors (warm/cool mix, not too harsh)
  const PALETTES=[
    ['#ff6b4a','#ff9966','#ffcc88','#ffeeaa'],
    ['#66aaff','#88ccff','#aaeeff','#cceeff'],
    ['#cc66ff','#ee88ff','#ffaacc','#ffccee'],
    ['#44ffaa','#88ffcc','#aaffee','#ccffee'],
    ['#ffdd44','#ffee88','#ffffaa','#ffffcc'],
    ['#ff4488','#ff66aa','#ff99cc','#ffbbdd'],
    ['#44ddff','#66eeff','#99ffff','#bbffff'],
    ['#ffaa33','#ffcc55','#ffee88','#ffffaa'],
  ];

  function randPalette(){return PALETTES[Math.floor(Math.random()*PALETTES.length)];}
  function rand(a,b){return a+Math.random()*(b-a);}

  // Particle
  class Particle{
    constructor(x,y,vx,vy,color,life,size,trail,gravity){
      this.x=x; this.y=y;
      this.vx=vx; this.vy=vy;
      this.color=color;
      this.life=life; this.maxLife=life;
      this.size=size;
      this.trail=trail; // array of past positions
      this.gravity=gravity||0.06;
      this.friction=rand(0.96,0.985);
      this.sparkle=Math.random()<0.3;
    }
    update(){
      if(this.trail){
        this.trail.push({x:this.x,y:this.y});
        if(this.trail.length>8)this.trail.shift();
      }
      this.x+=this.vx;
      this.y+=this.vy;
      this.vy+=this.gravity;
      this.vx*=this.friction;
      this.vy*=this.friction;
      this.life--;
    }
    draw(ctx){
      const t=this.life/this.maxLife;
      const alpha=t<0.3?t/0.3:1;
      if(this.trail&&this.trail.length>1){
        for(let i=1;i<this.trail.length;i++){
          const ta=((i/this.trail.length)*alpha*0.5);
          ctx.globalAlpha=ta;
          ctx.strokeStyle=this.color;
          ctx.lineWidth=this.size*t*0.7;
          ctx.beginPath();
          ctx.moveTo(this.trail[i-1].x,this.trail[i-1].y);
          ctx.lineTo(this.trail[i].x,this.trail[i].y);
          ctx.stroke();
        }
      }
      const glow=this.sparkle&&Math.random()<0.5?this.size*t*4:this.size*t*2.5;
      ctx.globalAlpha=alpha*0.18;
      ctx.fillStyle=this.color;
      ctx.beginPath();
      ctx.arc(this.x,this.y,glow*2,0,Math.PI*2);
      ctx.fill();
      ctx.globalAlpha=alpha*(this.sparkle&&Math.random()<0.5?1:0.85);
      ctx.fillStyle=this.color;
      ctx.beginPath();
      ctx.arc(this.x,this.y,this.size*t,0,Math.PI*2);
      ctx.fill();
    }
  }

  // Rocket (rising shell)
  class Rocket{
    constructor(x,targetY,palette){
      this.x=x;
      this.y=c.height+10;
      this.targetY=targetY;
      this.palette=palette;
      const dy=this.y-targetY;
      this.vy=-rand(8,14);
      this.vx=rand(-1.2,1.2);
      this.trail=[];
      this.done=false;
      this.exploded=false;
      this.smokeTimer=0;
    }
    update(particles){
      this.trail.push({x:this.x,y:this.y});
      if(this.trail.length>18)this.trail.shift();
      this.x+=this.vx;
      this.y+=this.vy;
      this.vy+=0.18;
      this.smokeTimer++;
      if(this.smokeTimer%2===0){
        particles.push(new Particle(
          this.x+rand(-2,2),this.y+rand(-2,2),
          rand(-0.3,0.3),rand(-0.3,0.3),
          '#888866',rand(18,30),rand(1,2.5),null,0
        ));
      }
      if(this.vy>=0||this.y<=this.targetY){
        this.explode(particles);
        this.done=true;
      }
    }
    explode(particles){
      const pal=this.palette;
      const type=Math.floor(Math.random()*5);
      const cx=this.x, cy=this.y;
      const count=rand(80,160)|0;
      if(type===0){
        // Classic burst
        for(let i=0;i<count;i++){
          const angle=Math.random()*Math.PI*2;
          const speed=rand(1.5,6.5);
          const col=pal[Math.floor(Math.random()*pal.length)];
          particles.push(new Particle(cx,cy,
            Math.cos(angle)*speed,Math.sin(angle)*speed,
            col,rand(60,100),rand(1.5,3),
            [],rand(0.04,0.09)
          ));
        }
      } else if(type===1){
        // Ring burst
        for(let i=0;i<count;i++){
          const angle=(i/count)*Math.PI*2;
          const speed=rand(3.5,5.5);
          const col=pal[i%pal.length];
          particles.push(new Particle(cx,cy,
            Math.cos(angle)*speed,Math.sin(angle)*speed,
            col,rand(55,90),rand(1.8,3.2),
            [],rand(0.05,0.08)
          ));
        }
        // Inner sparkles
        for(let i=0;i<30;i++){
          const angle=Math.random()*Math.PI*2;
          const speed=rand(0.5,2.5);
          const col=pal[Math.floor(Math.random()*pal.length)];
          particles.push(new Particle(cx,cy,
            Math.cos(angle)*speed,Math.sin(angle)*speed,
            col,rand(30,60),rand(1,2),null,0.08
          ));
        }
      } else if(type===2){
        // Double burst
        for(let layer=0;layer<2;layer++){
          const n=count/2|0;
          const spMin=layer===0?1.5:3.5, spMax=layer===0?3.5:6;
          for(let i=0;i<n;i++){
            const angle=Math.random()*Math.PI*2;
            const speed=rand(spMin,spMax);
            const col=pal[layer%pal.length];
            particles.push(new Particle(cx,cy,
              Math.cos(angle)*speed,Math.sin(angle)*speed,
              col,rand(50,90),rand(1.2,2.8),
              [],rand(0.04,0.09)
            ));
          }
        }
      } else if(type===3){
        // Willow (drooping streamers)
        for(let i=0;i<count;i++){
          const angle=Math.random()*Math.PI*2;
          const speed=rand(1,4.5);
          const col=pal[Math.floor(Math.random()*pal.length)];
          const trail=[];
          const p=new Particle(cx,cy,
            Math.cos(angle)*speed,Math.sin(angle)*speed,
            col,rand(90,130),rand(1,2),
            trail,rand(0.12,0.2)
          );
          p.friction=rand(0.97,0.995);
          particles.push(p);
        }
      } else {
        // Chrysanthemum (many fine sparks, no gravity drift)
        for(let i=0;i<count+40;i++){
          const angle=Math.random()*Math.PI*2;
          const speed=rand(2,7);
          const col=pal[Math.floor(Math.random()*pal.length)];
          const p=new Particle(cx,cy,
            Math.cos(angle)*speed,Math.sin(angle)*speed,
            col,rand(55,85),rand(0.8,2),
            [],rand(0.01,0.04)
          );
          p.friction=rand(0.985,0.998);
          particles.push(p);
        }
      }
      // Flash
      flashes.push({x:cx,y:cy,r:rand(60,120),life:8,maxLife:8,color:pal[0]});
    }
    draw(ctx){
      if(this.trail.length<2)return;
      for(let i=1;i<this.trail.length;i++){
        const t=i/this.trail.length;
        ctx.globalAlpha=t*0.7;
        ctx.strokeStyle='#ffeeaa';
        ctx.lineWidth=t*2.5;
        ctx.beginPath();
        ctx.moveTo(this.trail[i-1].x,this.trail[i-1].y);
        ctx.lineTo(this.trail[i].x,this.trail[i].y);
        ctx.stroke();
      }
      ctx.globalAlpha=1;
      ctx.fillStyle='#ffffff';
      ctx.beginPath();
      ctx.arc(this.x,this.y,2.5,0,Math.PI*2);
      ctx.fill();
    }
  }

  let rockets=[], particles=[], flashes=[];
  let lastLaunch=0, nextLaunchDelay=rand(400,900);

  // Ambient stars
  const stars=[];
  for(let i=0;i<120;i++){
    stars.push({
      x:Math.random(),y:Math.random(),
      r:rand(0.3,1.1),
      a:rand(0.1,0.35),
      twinkle:rand(0.005,0.02),
      phase:Math.random()*Math.PI*2
    });
  }

  let frame=0;

  function launchRocket(){
    const w=c.width, h=c.height;
    const x=w*rand(0.1,0.9)+(tiltX*w*0.03);
    const targetY=h*rand(0.08,0.42)+(tiltY*h*0.03);
    const pal=randPalette();
    rockets.push(new Rocket(x,targetY,pal));
  }

  function drawStars(){
    for(const s of stars){
      const a=s.a*(0.6+0.4*Math.sin(frame*s.twinkle+s.phase));
      ctx.globalAlpha=a;
      ctx.fillStyle='#eeeedd';
      ctx.beginPath();
      ctx.arc(s.x*c.width,s.y*c.height,s.r,0,Math.PI*2);
      ctx.fill();
    }
  }

  function tick(ts){
    requestAnimationFrame(tick);
    if(!visible)return;

    frame++;

    // Fade trail
    ctx.globalAlpha=0.18;
    ctx.fillStyle='#000000';
    ctx.fillRect(0,0,c.width,c.height);
    ctx.globalAlpha=1;

    // Stars
    drawStars();

    // Auto-launch
    const now=performance.now();
    const launchInterval = 600 + (1-Math.min(pageOffset*2,1))*400;
    if(now-lastLaunch>launchInterval){
      const burst=Math.random()<0.25?2:1;
      for(let b=0;b<burst;b++) launchRocket();
      lastLaunch=now;
    }

    // Flashes (bloom at explosion center)
    ctx.save();
    for(let i=flashes.length-1;i>=0;i--){
      const f=flashes[i];
      const t=f.life/f.maxLife;
      const grad=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r*t);
      grad.addColorStop(0,f.color+'aa');
      grad.addColorStop(0.3,f.color+'44');
      grad.addColorStop(1,f.color+'00');
      ctx.globalAlpha=t*0.7;
      ctx.fillStyle=grad;
      ctx.beginPath();
      ctx.arc(f.x,f.y,f.r*t,0,Math.PI*2);
      ctx.fill();
      f.life--;
      if(f.life<=0)flashes.splice(i,1);
    }
    ctx.restore();

    // Rockets
    ctx.save();
    ctx.lineCap='round';
    for(let i=rockets.length-1;i>=0;i--){
      rockets[i].update(particles);
      rockets[i].draw(ctx);
      if(rockets[i].done)rockets.splice(i,1);
    }
    ctx.restore();

    // Particles
    ctx.save();
    ctx.lineCap='round';
    for(let i=particles.length-1;i>=0;i--){
      particles[i].update();
      particles[i].draw(ctx);
      if(particles[i].life<=0)particles.splice(i,1);
    }
    ctx.restore();

    ctx.globalAlpha=1;

    // Trim overpopulation
    if(particles.length>1800)particles.splice(0,particles.length-1800);
  }

  requestAnimationFrame(tick);
})();
</script>
</body></html>
